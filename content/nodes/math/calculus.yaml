- id: derivative
  label: Derivative
  synonyms: [derivatives, differentiation, instantaneous rate]
  kind: math
  oneLiner: "The slope of a curve at a single point."
  intuition: "Zoom in on a smooth curve until it looks straight. The slope of that tiny straight piece is the derivative. It is like a speedometer reading at one instant."
  analogy: "A speedometer reading at one instant."
  showsUpIn: "Every training step that walks a loss downhill."
  viz: slope-derivative
  formula:
    tex: f'(x) = \lim_{h \to 0} \frac{f(x + h) - f(x)}{h}
    symbols:
      - symbol: f'(x)
        meaning: The derivative of f at the point x.
      - symbol: h
        meaning: A tiny step to the side.
      - symbol: \lim_{h \to 0}
        meaning: What the slope settles on as the step shrinks to nothing.
  resources:
    - title: "3Blue1Brown: The paradox of the derivative"
      url: https://www.3blue1brown.com/lessons/derivatives
    - title: "3Blue1Brown: Limits"
      url: https://www.3blue1brown.com/lessons/limits

- id: gradient
  label: Gradient
  synonyms: [partial derivatives, partial derivative, gradients]
  kind: math
  oneLiner: "A list of slopes, one per parameter."
  intuition: "With many inputs, you can ask for the slope along each one. A partial derivative is one such slope. The gradient collects them all and points uphill. It is like a compass that points up the steepest hill."
  analogy: "A compass that points up the steepest hill."
  showsUpIn: "Gradient descent, backpropagation and every neural network."
  formula:
    tex: \nabla L(w) = \left( \frac{\partial L}{\partial w_1}, \ldots, \frac{\partial L}{\partial w_n} \right)
    symbols:
      - symbol: \nabla L(w)
        meaning: The gradient of the loss at the weights w.
      - symbol: \frac{\partial L}{\partial w_1}
        meaning: The slope of the loss when only weight one moves.
      - symbol: n
        meaning: The number of weights.
  confusions:
    - The gradient points uphill. Training steps go the opposite way.
  resources:
    - title: "3Blue1Brown: Gradient descent"
      url: https://www.3blue1brown.com/lessons/gradient-descent
    - title: "NumPy: numpy.gradient"
      url: https://numpy.org/doc/stable/reference/generated/numpy.gradient.html

- id: chain-rule
  label: Chain rule
  synonyms: [composite functions]
  kind: math
  oneLiner: "How changes pass through functions nested inside each other."
  intuition: "When one thing drives a second that drives a third, the effects multiply. The chain rule multiplies the slopes along the chain. It is like gears turning gears in a clock."
  analogy: "Gears turning gears in a clock."
  showsUpIn: "Backpropagation in every neural network."
  formula:
    tex: \frac{d}{dx} f(g(x)) = f'(g(x)) \cdot g'(x)
    symbols:
      - symbol: f(g(x))
        meaning: A function nested inside another.
      - symbol: f'(g(x))
        meaning: The slope of the outer function, at the inner one's output.
      - symbol: g'(x)
        meaning: The slope of the inner function.
  resources:
    - title: "3Blue1Brown: Visualizing the chain rule"
      url: https://www.3blue1brown.com/lessons/chain-rule-and-product-rule
    - title: "3Blue1Brown: Backpropagation calculus"
      url: https://www.3blue1brown.com/lessons/backpropagation-calculus
  lenses:
    - neural-nets
