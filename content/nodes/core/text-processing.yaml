- id: tokenization
  label: Tokenization
  synonyms: [tokens, tokenizer]
  kind: concept
  lenses: [nlp]
  oneLiner: "Cutting text into words or pieces of words."
  intuition: "Models can't read raw text, so it is split into tokens first. Tokens can be words, parts of words or characters. It is like chopping vegetables before cooking. Every later step works on these pieces."
  analogy: "Chopping vegetables before cooking."
  code:
    tool: nltk-spacy
    snippet: |
      import spacy
      nlp = spacy.blank("en")
      doc = nlp("Claim your free prize now!")
      print([token.text for token in doc])
  confusions:
    - Tokens are not always words. Modern models split rare words into pieces.
  resources:
    - title: "scikit-learn: Text feature extraction"
      url: https://scikit-learn.org/stable/modules/feature_extraction.html

- id: bag-of-words
  label: Bag of words
  synonyms: [n-grams, ngrams, word counts, count vectorizer]
  kind: concept
  lenses: [nlp]
  oneLiner: "Represent text by counting each word, ignoring the order."
  intuition: "Each document becomes a row of word counts. Word order is thrown away. Counting pairs of words, called n-grams, keeps a little order. It is like tipping a sentence into a bag and counting the tiles."
  analogy: "Tipping a sentence into a bag and counting the tiles."
  confusions:
    - Bag of words loses word order. Not good and good not look the same.
  resources:
    - title: "scikit-learn: CountVectorizer"
      url: https://scikit-learn.org/stable/modules/generated/sklearn.feature_extraction.text.CountVectorizer.html
    - title: "scikit-learn: Text feature extraction"
      url: https://scikit-learn.org/stable/modules/feature_extraction.html

- id: tf-idf
  label: TF-IDF
  synonyms: [tfidf, term frequency]
  kind: concept
  lenses: [nlp]
  oneLiner: "Word counts that shrink words common to every document."
  intuition: "Words like 'the' appear everywhere and tell you little. TF-IDF boosts words that are frequent in one document but rare overall. It is like noticing a guest who only comes to one party. Those words say what a document is about."
  analogy: "Noticing a guest who only comes to one party."
  code:
    tool: scikit-learn
    snippet: |
      from sklearn.feature_extraction.text import TfidfVectorizer
      docs = ["Win a free prize now", "Your invoice is attached"]
      vectorizer = TfidfVectorizer()
      X = vectorizer.fit_transform(docs)
      print(vectorizer.get_feature_names_out())
  confusions:
    - TF-IDF still ignores word order and meaning. It only reweights counts.
  resources:
    - title: "scikit-learn: TfidfVectorizer"
      url: https://scikit-learn.org/stable/modules/generated/sklearn.feature_extraction.text.TfidfVectorizer.html
    - title: "scikit-learn: Tf-idf term weighting"
      url: https://scikit-learn.org/stable/modules/feature_extraction.html

- id: word-embeddings
  label: Word embeddings
  synonyms: [word2vec, glove, embeddings]
  kind: concept
  oneLiner: "Words as vectors, where similar meanings sit close together."
  intuition: "Each word gets a list of numbers learned from lots of text. Words used in similar contexts end up near each other. It is like a map where synonyms are neighbors. Directions on the map can even carry meaning."
  analogy: "A map where synonyms are neighbors."
  confusions:
    - An embedding's single numbers mean nothing alone. Only distances and directions carry meaning.
  resources:
    - title: "PyTorch: Word embeddings tutorial"
      url: https://pytorch.org/tutorials/beginner/nlp/word_embeddings_tutorial.html
    - title: "PyTorch: torch.nn.Embedding"
      url: https://pytorch.org/docs/stable/generated/torch.nn.Embedding.html
  lenses:
    - nlp
    - neural-nets

- id: topic-models
  label: Topic models
  synonyms: [latent dirichlet allocation, LDA topics, topic modeling]
  kind: concept
  lenses: [nlp]
  oneLiner: "Finding the themes that a pile of documents is about."
  intuition: "A topic model assumes each document mixes a few topics. Each topic is a set of words that tend to appear together. The model discovers both from raw text. It is like sorting newspaper clippings into piles by theme."
  analogy: "Sorting newspaper clippings into piles by theme."
  resources:
    - title: "scikit-learn: Topic extraction with NMF and LDA"
      url: https://scikit-learn.org/stable/auto_examples/applications/plot_topics_extraction_with_nmf_lda.html
    - title: "scikit-learn: LatentDirichletAllocation"
      url: https://scikit-learn.org/stable/modules/generated/sklearn.decomposition.LatentDirichletAllocation.html

- id: transformers
  label: Transformers
  synonyms: [attention, bert, gpt, llm, language model]
  kind: concept
  oneLiner: "Neural networks that read text by weighing every word against others."
  intuition: "Transformers use attention to decide which words matter for each word. They power modern language models. They go beyond this course's core, but it helps to place them. It is like a reader glancing back at the key words in a sentence."
  analogy: "A reader glancing back at the key words in a sentence."
  confusions:
    - These transformers are models, not the scikit-learn transformers that preprocess data.
  resources:
    - title: "3Blue1Brown: Transformers, the tech behind LLMs"
      url: https://www.3blue1brown.com/lessons/gpt
    - title: "3Blue1Brown: Attention in transformers"
      url: https://www.3blue1brown.com/lessons/attention
  lenses:
    - nlp
    - neural-nets
